# ExplainLaw Compose
#
# Прод (Yandex PG/Kafka/S3) — только приложение:
#   docker compose up -d --build
#
# Локально + своя инфра:
#   docker compose --profile local up -d --build
#
# Инфра без приложения:
#   docker compose --profile local up -d postgres minio kafka

services:
  # --- Приложение (по умолчанию, без profile) ---
  app:
    build: .
    image: explainlaw:latest
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - app_logs:/app/logs
      # CA Yandex Kafka/PG, если нужен файл с хоста:
      # - ${KAFKA_SSL_CA_HOST:-./certs}:/certs:ro
    restart: unless-stopped
    command: ["explainlaw", "serve", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  cron:
    image: explainlaw:latest
    build: .
    env_file: .env
    volumes:
      - app_logs:/app/logs
    restart: unless-stopped
    command: ["supercronic", "-passthrough-logs", "/app/docker/crontab"]
    depends_on:
      app:
        condition: service_started

  # --- Локальная инфра (только --profile local) ---
  postgres:
    profiles: ["local"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: explainlaw
      POSTGRES_USER: explainlaw
      POSTGRES_PASSWORD: explainlaw
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U explainlaw -d explainlaw"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    profiles: ["local"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: explainlaw
      MINIO_ROOT_PASSWORD: explainlawsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    profiles: ["local"]
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 explainlaw explainlawsecret &&
      mc mb --ignore-existing local/npa-raw &&
      mc mb --ignore-existing local/npa-snapshots
      "

  kafka:
    profiles: ["local"]
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 8
      start_period: 30s

volumes:
  app_logs:
  postgres_data:
  minio_data:
  kafka_data:
